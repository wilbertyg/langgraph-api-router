[project]
name = "agentic"
version = "0.1.0"
description = "LangGraph router: local Parakeet STT + Gemini light/heavy models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi>=0.111.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.20",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.53.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Local speech-to-text (needs a CUDA build of torch for GPU use)
stt = ["nemo_toolkit[asr]>=2.0.0"]

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
