[project]
name = "agentic"
version = "0.1.0"
description = "LangGraph router: local Parakeet STT + Gemini light/heavy models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi>=0.111.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.20",
    "librosa>=0.10",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "torch>=2.6.0",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=5.6.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

# CUDA builds of torch (transformers 5 needs torch >= 2.6)
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
